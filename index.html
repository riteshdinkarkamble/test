<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenShift Cloud Flight 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #ui-layer { position: absolute; top: 20px; left: 20px; color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none; text-shadow: 0 0 8px #00ffcc; }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #888; font-size: 14px; pointer-events: none; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0055; font-size: 48px; font-weight: bold; text-align: center; text-shadow: 0 0 15px #ff0055; }
    </style>
    <!-- Include Three.js WebGL Engine Engine Core via CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui-layer">SCORE: <span id="score-val">0</span></div>
    <div id="game-over">GAME OVER<br><span style="font-size: 20px; color: #fff;">Refresh (F5) to Fly Again</span></div>
    <div id="instructions">🚀 Use <b>W, A, S, D</b> or <b>ARROW KEYS</b> to steer your ship through the 3D space field!</div>

<script>
// --- 1. SETUP 3D GRAPHICS ENVIRONMENT ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.015); // Adds realistic space depth attenuation

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- 2. ADD ENGINE LIGHTING Matrix ---
const ambientLight = new THREE.AmbientLight(0x333333);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0x00ffcc, 1);
directionalLight.position.set(0, 10, 10);
scene.add(directionalLight);

// --- 3. CREATE PLAYER 3D SPACESHIP ---
const shipGroup = new THREE.Group();

// Main Cabin/Hull Shape
const bodyGeom = new THREE.ConeGeometry(0.5, 2, 4);
bodyGeom.rotateX(Math.PI / 2); // Orient forward along Z-axis
const bodyMat = new THREE.MeshPhongMaterial({ color: 0x0066ff, shininess: 100, flatShading: true });
const shipBody = new THREE.Mesh(bodyGeom, bodyMat);
shipGroup.add(shipBody);

// Left Wing Element
const wingGeom = new THREE.BoxGeometry(1.5, 0.1, 0.8);
const wingMat = new THREE.MeshPhongMaterial({ color: 0x00ffcc, flatShading: true });
const leftWing = new THREE.Mesh(wingGeom, wingMat);
leftWing.position.set(0, -0.2, -0.2);
shipGroup.add(leftWing);

scene.add(shipGroup);
shipGroup.position.set(0, 0, 0);

// Position camera slightly behind and above our spaceship
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, -5);

// --- 4. ENGINE OBSTACLES (3D Asteroids) SYSTEM ---
const asteroids = [];
const asteroidGeometry = new THREE.DodecahedronGeometry(0.8, 1);
const asteroidMaterial = new THREE.MeshPhongMaterial({ color: 0x665544, flatShading: true });

function spawnAsteroid() {
    const obstacle = new THREE.Mesh(asteroidGeometry, asteroidMaterial);
    // Random placement far ahead along the Z-axis field
    obstacle.position.x = (Math.random() - 0.5) * 15;
    obstacle.position.y = (Math.random() - 0.5) * 10;
    obstacle.position.z = -60; 
    
    // Random rotational spin parameters
    obstacle.userData = {
        rotX: Math.random() * 0.02,
        rotY: Math.random() * 0.02
    };

    scene.add(obstacle);
    asteroids.push(obstacle);
}

// --- 5. KEYBOARD RUNTIME TRACKING ---
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// --- 6. CORE 3D MECHANICS LOOP ---
let score = 0;
let isGameOver = false;
let gameSpeed = 0.4;

function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    // Player Steering Inputs
    if (keys['w'] || keys['arrowup']) shipGroup.position.y += 0.1;
    if (keys['s'] || keys['arrowdown']) shipGroup.position.y -= 0.1;
    if (keys['a'] || keys['arrowleft']) shipGroup.position.x -= 0.1;
    if (keys['d'] || keys['arrowright']) shipGroup.position.x += 0.1;

    // Constrain flight grid boundaries so player doesn't fly off-screen
    shipGroup.position.x = Math.max(-7, Math.min(7, shipGroup.position.x));
    shipGroup.position.y = Math.max(-4, Math.min(4, shipGroup.position.y));

    // Slight visual banking rotation when steering left/right
    if (keys['a'] || keys['arrowleft']) shipGroup.rotation.z = 0.3;
    else if (keys['d'] || keys['arrowright']) shipGroup.rotation.z = -0.3;
    else shipGroup.rotation.z = 0;

    // Dynamically adjust camera alignment slightly based on player movement
    camera.position.x = shipGroup.position.x * 0.5;

    // Process Asteroid Mechanics
    if (Math.random() < 0.08) spawnAsteroid(); // Spawning frequency

    for (let i = asteroids.length - 1; i >= 0; i--) {
        const ast = asteroids[i];
        ast.position.z += gameSpeed; // Move obstacles closer to the screen
        
        // Apply spin mechanics
        ast.rotation.x += ast.userData.rotX;
        ast.rotation.y += ast.userData.rotY;

        // Bounding Box 3D Collision Detection
        const distance = shipGroup.position.distanceTo(ast.position);
        if (distance < 1.1) {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'block';
        }

        // Cleanup objects that pass safely behind camera viewport
        if (ast.position.z > 5) {
            scene.remove(ast);
            asteroids.splice(i, 1);
            score += 10;
            document.getElementById('score-val').innerText = score;
            
            // Gradually scale difficulty speed safely
            gameSpeed += 0.002;
        }
    }

    renderer.render(scene, camera);
}

// Adjust window resizing safely in real time
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Fire up the WebGL engine loop
requestAnimationFrame(animate);
</script>
</body>
</html>
