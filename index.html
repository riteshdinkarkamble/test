<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Safari - Interactive Scene</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        #overlay h1 { margin: 0 0 5px 0; font-size: 1.5em; }
        #overlay p { margin: 0; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Jungle Safari</h1>
        <p>OpenShift Containerized Interactive Scene (Live View)</p>
    </div>

    <!-- The 3D view will be rendered here -->
    <script type="module" src="app.js"></script>
</body>
</html>
