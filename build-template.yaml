apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: game-3d
  labels:
    app: game-3d
spec:
  output:
    to:
      kind: ImageStreamTag
      name: game-3d:latest
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      # This explicitly overrides OpenShift's broken template engine path
      dockerfilePath: Containerfile
